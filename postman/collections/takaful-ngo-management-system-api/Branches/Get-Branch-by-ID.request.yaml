$kind: http-request
name: Get Branch by ID
order: 3000
method: GET
url: '{{baseUrl}}/api/branches/{{branchPublicId}}'
description: |-
  ## Get Branch by ID

  Retrieves the full details of a single branch using its unique public identifier.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  ### Path Parameters
  | Parameter | Type   | Required | Description |
  |-----------|--------|----------|-------------|
  | publicId  | string | ✅ Yes   | The branch's public ID (e.g. `BRN-000001`). Stored in the `branchPublicId` environment variable after creating a branch. |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "publicId": "BRN-000001",
      "name": "Gaza City Branch",
      "governorate": "GAZA",
      "address": "Al-Rimal, Gaza City, Palestine",
      "phone": "0599000001",
      "isActive": true,
      "createdAt": "2024-01-01T00:00:00.000Z",
      "updatedAt": "2024-01-01T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required privileges
  - `404 Not Found` — No branch found with the given `publicId`
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: publicId
    value: '{{branchPublicId}}'
    description: 'The public ID of the branch (e.g. BRN-000001)'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Branch publicId matches", () => {
          pm.expect(pm.response.json().data.publicId).to.eql(pm.environment.get("branchPublicId"));
      });
      pm.test("Branch has governorate", () => {
          pm.expect(pm.response.json().data).to.have.property("governorate");
      });
examples: './.resources/Get-Branch-by-ID.resources/examples'
