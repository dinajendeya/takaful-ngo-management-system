$kind: http-example
name: '403 Forbidden'
request:
  url: '{{baseUrl}}/api/branches'
  method: POST
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "reason": "The authenticated user does not have the required role or permission to perform this action.",
        "message": "Forbidden"
      }
