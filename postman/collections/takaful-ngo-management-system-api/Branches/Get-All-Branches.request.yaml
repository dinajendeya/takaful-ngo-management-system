$kind: http-request
name: Get All Branches
order: 2000
method: GET
url: '{{baseUrl}}/api/branches?page=1&pageSize=20'
description: |-
  ## Get All Branches

  Retrieves a list of all branches registered in the Takaful NGO system. Supports optional filtering and searching.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  ### Query Parameters
  | Parameter     | Type    | Required | Default    | Description |
  |---------------|---------|----------|------------|-------------|
  | page          | integer | ❌ No    | `1`        | Page number for pagination |
  | pageSize      | integer | ❌ No    | `20`       | Number of results per page |
  | search        | string  | ❌ No    | —          | Filter branches by name (partial match) |
  | sortBy        | string  | ❌ No    | `createdAt`| Field to sort results by |
  | sortDirection | string  | ❌ No    | `desc`     | Sort order: `asc` or `desc` |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": [
      {
        "publicId": "BRN-000001",
        "name": "Gaza City Branch",
        "governorate": "GAZA",
        "address": "Al-Rimal, Gaza City, Palestine",
        "phone": "0599000001",
        "isActive": true,
        "createdAt": "2024-01-01T00:00:00.000Z",
        "updatedAt": "2024-01-01T00:00:00.000Z"
      }
    ]
  }
  ```

  ### Error Responses
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required privileges
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: page
    value: '1'
    description: Page number (default 1)
  - key: pageSize
    value: '20'
    description: Number of branches per page (default 20)
  - key: search
    value: ''
    description: Search by branch name (partial match)
    disabled: true
  - key: sortBy
    value: createdAt
    description: 'Field to sort by (e.g. createdAt, name)'
    disabled: true
  - key: sortDirection
    value: desc
    description: 'Sort direction: asc or desc'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Data is an array", () => {
          pm.expect(pm.response.json().data).to.be.an("array");
      });
examples: './.resources/Get-All-Branches.resources/examples'
