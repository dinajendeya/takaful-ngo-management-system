$kind: http-example
name: '401 Unauthorized'
request:
  url: '{{baseUrl}}/api/auth/login'
  method: POST
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "reason": "Invalid email or password, or the account has been deactivated.",
        "message": "Unauthorized"
      }
