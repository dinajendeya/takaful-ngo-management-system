$kind: http-request
name: Approve Family Request
order: 6000
method: PATCH
url: '{{baseUrl}}/api/family-requests/{{familyRequestPublicId}}/approve'
description: |-
  ## Approve Family Request

  Approves a pending family update request. Upon approval, all proposed changes (family data, assessment updates, member additions/updates/deletions) are applied to the family record. Only requests in `PENDING` status can be approved.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  > 🔒 **Staff Only** — Restricted to users with the `ADMIN` or `BRANCH_MANAGER` role. Family tokens are not accepted.

  ### Path Parameters
  | Parameter | Type   | Required | Description |
  |-----------|--------|----------|-------------|
  | id        | string | ✅ Yes   | The request's public ID (e.g. `REQ-000001`). Stored in the `familyRequestPublicId` environment variable. |

  ### Request Body Fields
  | Field       | Type   | Required | Description |
  |-------------|--------|----------|-------------|
  | reviewNotes | string | ❌ No    | Optional notes from the reviewer (max 1000 characters) |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "publicId": "REQ-000001",
      "status": "APPROVED",
      "reviewNotes": "Verified during field visit. Changes applied.",
      "updatedAt": "2024-01-02T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user is not an admin or branch manager
  - `404 Not Found` — No request found with the given public ID
  - `409 Conflict` — Request is not in `PENDING` status
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{familyRequestPublicId}}'
    description: 'The public ID of the family request to approve (e.g. REQ-000001)'
body:
  type: json
  content: |-
    {
      "reviewNotes": "Verified during field visit. All proposed changes are accurate and have been applied."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Request status is APPROVED", () => {
          pm.expect(pm.response.json().data.status).to.eql("APPROVED");
      });
