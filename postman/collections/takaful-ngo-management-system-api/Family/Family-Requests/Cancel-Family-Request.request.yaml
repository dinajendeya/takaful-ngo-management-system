$kind: http-request
name: Cancel Family Request
order: 5000
method: PATCH
url: '{{baseUrl}}/api/family-requests/{{familyRequestPublicId}}/cancel'
description: |-
  ## Cancel Family Request

  Allows the submitting family to cancel a pending update request before it has been reviewed. Only requests in `PENDING` status can be cancelled. An optional cancellation reason can be provided.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header obtained from the **Family Login** endpoint.

  > 🔒 **Family Principal Only** — Only the family that submitted the request can cancel it.

  > 🔒 **Password Change Required** — The family's password must have been changed from the initial one before this endpoint can be used.

  ### Path Parameters
  | Parameter | Type   | Required | Description |
  |-----------|--------|----------|-------------|
  | id        | string | ✅ Yes   | The request's public ID (e.g. `REQ-000001`). Stored in the `familyRequestPublicId` environment variable. |

  ### Request Body Fields
  | Field  | Type   | Required | Description |
  |--------|--------|----------|-------------|
  | reason | string | ❌ No    | Optional reason for cancellation (max 1000 characters) |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "publicId": "REQ-000001",
      "status": "CANCELLED",
      "updatedAt": "2024-01-02T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Token does not belong to the submitting family, or password not yet changed
  - `404 Not Found` — No request found with the given public ID
  - `409 Conflict` — Request is not in `PENDING` status (already approved, rejected, or cancelled)
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{familyRequestPublicId}}'
    description: 'The public ID of the family request to cancel (e.g. REQ-000001)'
body:
  type: json
  content: |-
    {
      "reason": "The situation has changed and the update is no longer needed."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Request status is CANCELLED", () => {
          pm.expect(pm.response.json().data.status).to.eql("CANCELLED");
      });
