$kind: http-request
name: Create Family
order: 1000
method: POST
url: '{{baseUrl}}/api/families'
description: |-
  ## Create Family

  Registers a new family in the Takaful NGO system. This endpoint is used by staff (employees) to enroll a family — the family's password is **not** set here; it is assigned separately. Only authenticated staff members can create families.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header. The token must belong to a staff principal (admin, branch manager, or field researcher).

  ### Request Body Fields

  #### Top-level Fields
  | Field          | Type   | Required | Description |
  |----------------|--------|----------|-------------|
  | branchId       | string | ✅ Yes   | Public ID of the branch this family belongs to (e.g. `BRN-000001`) |
  | primaryPhone   | string | ✅ Yes   | Primary contact phone — format: `05XXXXXXXX` or `+97005XXXXXXXX` |
  | emergencyPhone | string | ❌ No    | Emergency contact phone — same format |

  #### `originalAddress` & `currentAddress` (both required)
  | Field             | Type   | Required | Description |
  |-------------------|--------|----------|-------------|
  | governorate       | enum   | ✅ Yes   | One of: `NORTH_GAZA`, `GAZA`, `DEIR_AL_BALAH`, `KHAN_YOUNIS`, `RAFAH` |
  | city              | string | ✅ Yes   | City name (3–100 characters) |
  | neighborhood      | string | ✅ Yes   | Neighborhood name (3–200 characters) |
  | street            | string | ❌ No    | Street name (max 200 characters) |
  | nearbyLandmark    | string | ❌ No    | Nearby landmark (max 200 characters) |
  | additionalDetails | string | ❌ No    | Extra address details (max 1000 characters) |

  ### Success Response `201 Created`
  ```json
  {
    "success": true,
    "data": {
      "publicId": "FAM-000001",
      "primaryPhone": "0599000001",
      "status": "PENDING",
      "branchId": "BRN-000001",
      "isPasswordChanged": false,
      "createdAt": "2024-01-01T00:00:00.000Z",
      "updatedAt": "2024-01-01T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — Validation failed (missing required fields or invalid values)
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required privileges
  - `409 Conflict` — A family with the same primary phone already exists

  ### Post-request Script
  On success, the `familyPublicId` environment variable is automatically set to the newly created family's `publicId`.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "branchId": "{{branchPublicId}}",
      "primaryPhone": "0599000001",
      "emergencyPhone": "0599000002",
      "originalAddress": {
        "governorate": "GAZA",
        "city": "Gaza City",
        "neighborhood": "Al-Rimal",
        "street": "Omar Al-Mukhtar Street",
        "nearbyLandmark": "Near Al-Shifa Hospital",
        "additionalDetails": "3rd floor, apartment 5"
      },
      "currentAddress": {
        "governorate": "KHAN_YOUNIS",
        "city": "Khan Younis",
        "neighborhood": "Al-Amal",
        "street": "Salah Al-Din Street",
        "nearbyLandmark": "Near Khan Younis Hospital"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => {
          pm.response.to.have.status(201);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Family publicId is present", () => {
          pm.expect(pm.response.json().data).to.have.property("publicId");
      });
      pm.test("Family status is PENDING", () => {
          pm.expect(pm.response.json().data.status).to.eql("PENDING");
      });

      const data = pm.response.json().data;
      if (data && data.publicId) {
          pm.environment.set("familyPublicId", data.publicId);
      }
