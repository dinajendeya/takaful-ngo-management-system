$kind: http-request
name: Reject Family
order: 6000
method: PATCH
url: '{{baseUrl}}/api/families/{{familyPublicId}}/reject'
description: |-
  ## Reject Family

  Marks a family as **rejected** after review. A rejection reason must be provided. Only families in `PENDING` status can be rejected. Rejected families cannot access services.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  > 🔒 **Password Change Required** — The family's password must have been changed from the initial one before this endpoint can be used.

  ### Path Parameters
  | Parameter | Type   | Required | Description |
  |-----------|--------|----------|-------------|
  | id        | string | ✅ Yes   | The family's public ID (e.g. `FAM-000001`). Stored in the `familyPublicId` environment variable. |

  ### Request Body Fields
  | Field           | Type   | Required | Description |
  |-----------------|--------|----------|-------------|
  | rejectionReason | string | ✅ Yes   | Reason for rejection (5–1000 characters) |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "publicId": "FAM-000001",
      "status": "REJECTED",
      "rejectionReason": "Provided information could not be verified.",
      "updatedAt": "2024-01-02T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — Validation failed (missing or too-short rejection reason)
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required privileges, or family password not yet changed
  - `404 Not Found` — No family found with the given public ID
  - `409 Conflict` — Family is not in `PENDING` status
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{familyPublicId}}'
    description: 'The public ID of the family to reject (e.g. FAM-000001)'
body:
  type: json
  content: |-
    {
      "rejectionReason": "Provided information could not be verified during field visit."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Family status is REJECTED", () => {
          pm.expect(pm.response.json().data.status).to.eql("REJECTED");
      });
