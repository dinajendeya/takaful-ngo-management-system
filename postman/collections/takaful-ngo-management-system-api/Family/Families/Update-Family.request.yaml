$kind: http-request
name: Update Family
order: 4000
method: PATCH
url: '{{baseUrl}}/api/families/{{familyPublicId}}'
description: |-
  ## Update Family

  Partially updates an existing family's information. All fields are optional — only the fields provided will be updated. Staff members with appropriate privileges can update family details.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  > 🔒 **Password Change Required** — The family's password must have been changed from the initial one before this endpoint can be used.

  ### Path Parameters
  | Parameter | Type   | Required | Description |
  |-----------|--------|----------|-------------|
  | id        | string | ✅ Yes   | The family's public ID (e.g. `FAM-000001`). Stored in the `familyPublicId` environment variable. |

  ### Request Body Fields (all optional)
  | Field          | Type   | Description |
  |----------------|--------|-------------|
  | branchId       | string | New branch public ID |
  | primaryPhone   | string | Updated primary phone — format: `05XXXXXXXX` or `+97005XXXXXXXX` |
  | emergencyPhone | string | Updated emergency phone |
  | originalAddress | object | Updated original address (see address fields below) |
  | currentAddress  | object | Updated current address (see address fields below) |

  #### Address Fields (all optional when updating)
  | Field             | Type   | Description |
  |-------------------|--------|-------------|
  | governorate       | enum   | One of: `NORTH_GAZA`, `GAZA`, `DEIR_AL_BALAH`, `KHAN_YOUNIS`, `RAFAH` |
  | city              | string | City name (3–100 characters) |
  | neighborhood      | string | Neighborhood name (3–200 characters) |
  | street            | string | Street name (max 200 characters) |
  | nearbyLandmark    | string | Nearby landmark (max 200 characters) |
  | additionalDetails | string | Extra address details (max 1000 characters) |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "publicId": "FAM-000001",
      "primaryPhone": "0599000099",
      "status": "VERIFIED",
      "updatedAt": "2024-01-02T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — Validation failed (invalid field values)
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required privileges, or family password not yet changed
  - `404 Not Found` — No family found with the given public ID
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{familyPublicId}}'
    description: 'The public ID of the family to update (e.g. FAM-000001)'
body:
  type: json
  content: |-
    {
      "primaryPhone": "0599000099",
      "emergencyPhone": "0599000088",
      "currentAddress": {
        "governorate": "RAFAH",
        "city": "Rafah",
        "neighborhood": "Al-Shaboura",
        "street": "Al-Jalaa Street",
        "nearbyLandmark": "Near Rafah Border Crossing"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Family publicId is unchanged", () => {
          pm.expect(pm.response.json().data.publicId).to.eql(pm.environment.get("familyPublicId"));
      });
