$kind: http-request
name: Verify Family
order: 5000
method: PATCH
url: '{{baseUrl}}/api/families/{{familyPublicId}}/verify'
description: |-
  ## Verify Family

  Marks a family as **verified** after a field researcher or admin has confirmed their information. Only families in `PENDING` status can be verified. Once verified, the family gains access to services and can submit update requests.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  > 🔒 **Password Change Required** — The family's password must have been changed from the initial one before this endpoint can be used.

  ### Path Parameters
  | Parameter | Type   | Required | Description |
  |-----------|--------|----------|-------------|
  | id        | string | ✅ Yes   | The family's public ID (e.g. `FAM-000001`). Stored in the `familyPublicId` environment variable. |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "publicId": "FAM-000001",
      "status": "VERIFIED",
      "updatedAt": "2024-01-02T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required privileges, or family password not yet changed
  - `404 Not Found` — No family found with the given public ID
  - `409 Conflict` — Family is not in `PENDING` status
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{familyPublicId}}'
    description: 'The public ID of the family to verify (e.g. FAM-000001)'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Family status is VERIFIED", () => {
          pm.expect(pm.response.json().data.status).to.eql("VERIFIED");
      });
