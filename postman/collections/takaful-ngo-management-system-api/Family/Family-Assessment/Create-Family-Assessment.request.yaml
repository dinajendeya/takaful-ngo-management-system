$kind: http-request
name: Create Family Assessment
order: 1000
method: POST
url: '{{baseUrl}}/api/families/{{familyPublicId}}/assessment'
description: |-
  ## Create Family Assessment

  Creates a socio-economic assessment for a family. The assessment captures financial, housing, and living condition data used to determine the family's eligibility and priority for aid. Each family can have only one assessment — use the Update endpoint to modify it.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  > 🔒 **Password Change Required** — The family's password must have been changed from the initial one before this endpoint can be used.

  ### Path Parameters
  | Parameter | Type   | Required | Description |
  |-----------|--------|----------|-------------|
  | familyId  | string | ✅ Yes   | The family's public ID (e.g. `FAM-000001`). Stored in the `familyPublicId` environment variable. |

  ### Request Body Fields
  | Field                | Type    | Required | Description |
  |----------------------|---------|----------|-------------|
  | monthlyFamilyIncome  | number  | ✅ Yes   | Total monthly family income in currency (≥ 0) |
  | rentCost             | number  | ✅ Yes   | Monthly rent cost (≥ 0, or `null` if not applicable) |
  | housingType          | enum    | ✅ Yes   | `OWNER`, `RENT`, `HOSTING`, `TENT`, `FULL_HOUSE`, `PARTIALLY_DESTROYED`, `TOTALLY_DESTROYED` |
  | isDisplaced          | boolean | ✅ Yes   | Whether the family has been displaced from their original home |
  | isRegisteredInCamp   | boolean | ✅ Yes   | Whether the family is registered in a displacement camp |
  | hasElectricity       | boolean | ✅ Yes   | Whether the family has access to electricity |
  | hasInternet          | boolean | ✅ Yes   | Whether the family has access to internet |
  | notes                | string  | ❌ No    | Additional notes about the family's situation (max 1000 characters) |

  ### Success Response `201 Created`
  ```json
  {
    "success": true,
    "data": {
      "id": 1,
      "monthlyFamilyIncome": 0,
      "rentCost": null,
      "housingType": "TENT",
      "isDisplaced": true,
      "isRegisteredInCamp": true,
      "hasElectricity": false,
      "hasInternet": false,
      "notes": "Family displaced from Gaza City, currently in Rafah.",
      "createdAt": "2024-01-01T00:00:00.000Z",
      "updatedAt": "2024-01-01T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — Validation failed (missing required fields or invalid values)
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required privileges, or family password not yet changed
  - `404 Not Found` — No family found with the given familyId
  - `409 Conflict` — An assessment already exists for this family (use PATCH to update)
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: familyId
    value: '{{familyPublicId}}'
    description: 'The public ID of the family (e.g. FAM-000001)'
body:
  type: json
  content: |-
    {
      "monthlyFamilyIncome": 0,
      "rentCost": null,
      "housingType": "TENT",
      "isDisplaced": true,
      "isRegisteredInCamp": true,
      "hasElectricity": false,
      "hasInternet": false,
      "notes": "Family displaced from Gaza City, currently sheltering in Rafah near the border."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => {
          pm.response.to.have.status(201);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Assessment housingType is present", () => {
          pm.expect(pm.response.json().data).to.have.property("housingType");
      });
      pm.test("Assessment isDisplaced is present", () => {
          pm.expect(pm.response.json().data).to.have.property("isDisplaced");
      });
