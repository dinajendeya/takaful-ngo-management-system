$kind: http-request
name: Family Refresh Token
order: 2000
method: POST
url: '{{baseUrl}}/api/family-auth/refresh'
description: |-
  ## Family Refresh Token

  Issues a new JWT access token using a valid refresh token. Use this endpoint when the family's access token has expired to obtain a new one without requiring re-login.

  ### Request Body Fields
  | Field        | Type   | Required | Description |
  |--------------|--------|----------|-------------|
  | refreshToken | string | ✅ Yes   | A valid, non-expired refresh token obtained from the Family Login endpoint |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "accessToken": "<new_jwt_access_token>",
      "refreshToken": "<new_jwt_refresh_token>"
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — Validation failed (missing or empty refreshToken)
  - `401 Unauthorized` — Refresh token is invalid or expired

  ### Post-request Script
  On success, the `accessToken` and `refreshToken` environment variables are automatically updated.
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("New access token is present", () => {
          pm.expect(pm.response.json().data).to.have.property("accessToken");
      });

      const data = pm.response.json().data;
      if (data && data.accessToken) {
          pm.environment.set("accessToken", data.accessToken);
      }
      if (data && data.refreshToken) {
          pm.environment.set("refreshToken", data.refreshToken);
      }
