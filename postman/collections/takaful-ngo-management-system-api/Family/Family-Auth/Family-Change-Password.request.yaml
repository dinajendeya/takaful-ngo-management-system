$kind: http-request
name: Family Change Password
order: 5000
method: PATCH
url: '{{baseUrl}}/api/family-auth/password'
description: |-
  ## Family Change Password

  Allows an authenticated family to change their password. Families are required to change their initial password (set by staff during registration) before accessing most protected family endpoints.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header obtained from the **Family Login** endpoint.

  > 🔒 **Family Principal Only** — Only tokens issued to a family are accepted.

  > ⚠️ **First-time Login Requirement** — Until the family changes their initial password, most family-protected routes will return `403 Forbidden` with a prompt to change the password.

  ### Request Body Fields
  | Field           | Type   | Required | Description |
  |-----------------|--------|----------|-------------|
  | currentPassword | string | ✅ Yes   | The family's current (or initial) password |
  | newPassword     | string | ✅ Yes   | The new password — must be strong (min 8 chars, uppercase, lowercase, number, special char) |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "message": "Password changed successfully"
  }
  ```

  ### Error Responses
  - `400 Bad Request` — Validation failed (weak password or missing fields)
  - `401 Unauthorized` — Missing or invalid access token, or wrong current password
  - `403 Forbidden` — Token does not belong to a family principal
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "Family@1234",
      "newPassword": "NewFamily@5678"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
