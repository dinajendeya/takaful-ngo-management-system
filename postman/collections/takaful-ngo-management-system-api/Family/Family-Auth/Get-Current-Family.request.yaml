$kind: http-request
name: Get Current Family
order: 3000
method: GET
url: '{{baseUrl}}/api/family-auth/me'
description: |-
  ## Get Current Family

  Returns the profile of the currently authenticated family. This endpoint is restricted to family principals only — staff/admin tokens are not accepted.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header obtained from the **Family Login** endpoint.

  > 🔒 **Family Principal Only** — Only tokens issued to a family (via `/family-auth/login`) are accepted. Staff tokens will be rejected with `403 Forbidden`.

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "publicId": "FAM-000001",
      "primaryPhone": "0599000001",
      "status": "VERIFIED",
      "branchId": "BRN-000001",
      "isPasswordChanged": true,
      "createdAt": "2024-01-01T00:00:00.000Z",
      "updatedAt": "2024-01-01T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Token does not belong to a family principal
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Family publicId is present", () => {
          pm.expect(pm.response.json().data).to.have.property("publicId");
      });
      pm.test("Family status is present", () => {
          pm.expect(pm.response.json().data).to.have.property("status");
      });
