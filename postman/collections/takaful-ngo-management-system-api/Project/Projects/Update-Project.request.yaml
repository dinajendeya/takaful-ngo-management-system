$kind: http-request
name: Update Project
order: 4000
method: PATCH
url: '{{baseUrl}}/api/projects/{{projectPublicId}}'
description: |-
  ## Update Project

  Partially updates an existing aid distribution project. All fields are optional. If `parcels` is provided, the system performs a **smart upsert**:
  - New templates are added with `availableQuantity = targetQuantity`
  - Existing templates have their `targetQuantity` updated and `availableQuantity` adjusted by the difference
  - Templates omitted from the payload are **removed** from the project

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header. Only **ADMIN** and **BRANCH_MANAGER** roles are authorized to update projects.

  ### Path Parameters
  | Parameter | Type            | Required | Description |
  |-----------|-----------------|----------|-------------|
  | id        | string (numeric)| ✅ Yes   | Numeric ID of the project to update. Stored in the `projectPublicId` environment variable. |

  ### Request Body Fields (all optional)
  | Field                      | Type            | Description |
  |----------------------------|-----------------|-------------|
  | name                       | string          | Updated project name (1–200 characters) |
  | description                | string          | Updated description (max 5000 characters) |
  | startDate                  | ISO date string | Updated start date |
  | endDate                    | ISO date string | Updated end date |
  | status                     | enum            | New status: `DRAFT`, `ACTIVE`, `COMPLETED`, or `CANCELLED` |
  | parcels                    | array           | Replacement parcel target list (smart upsert — see above) |
  | parcels[].parcelTemplateId | string (numeric)| Numeric ID of a parcel template |
  | parcels[].targetQuantity   | integer (≥ 0)   | Updated maximum quantity |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "id": "1",
      "name": "Winter Relief 2024 - Extended",
      "description": "Emergency winter aid for displaced families",
      "startDate": "2024-01-01T00:00:00.000Z",
      "endDate": "2024-06-30T00:00:00.000Z",
      "status": "ACTIVE",
      "createdById": "1",
      "createdAt": "2024-01-01T00:00:00.000Z",
      "createdBy": { "id": "1", "fullName": "Admin User" },
      "projectParcels": [
        {
          "projectId": "1",
          "parcelTemplateId": "1",
          "targetQuantity": 150,
          "availableQuantity": 135,
          "parcelTemplate": { "id": "1", "name": "Basic Food Parcel" }
        }
      ]
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — Validation failed (invalid field values)
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required role
  - `404 Not Found` — Project not found, or a parcel template ID is invalid
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{projectPublicId}}'
    description: 'Numeric ID of the project to update. Set automatically by the Create Project request.'
body:
  type: json
  content: |-
    {
      "name": "Winter Relief 2024 - Extended",
      "status": "ACTIVE",
      "endDate": "2024-06-30",
      "parcels": [
        {
          "parcelTemplateId": "{{parcelTemplateId}}",
          "targetQuantity": 150
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Project id is unchanged", () => {
          pm.expect(pm.response.json().data.id).to.eql(pm.environment.get("projectPublicId"));
      });
      pm.test("Project status is ACTIVE", () => {
          pm.expect(pm.response.json().data.status).to.eql("ACTIVE");
      });
      pm.test("Updated projectParcels are present", () => {
          pm.expect(pm.response.json().data.projectParcels).to.be.an("array").with.length.above(0);
      });
examples: './.resources/Update-Project.resources/examples'
