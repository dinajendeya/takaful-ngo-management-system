$kind: http-request
name: Get User by ID
order: 3000
method: GET
url: '{{baseUrl}}/api/users/{{userPublicId}}'
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: publicId
    value: '{{userPublicId}}'
    description: The public ID of the user (e.g. USR-000001)
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("User publicId matches", () => {
          pm.expect(pm.response.json().data.publicId).to.eql(pm.environment.get("userPublicId"));
      });
