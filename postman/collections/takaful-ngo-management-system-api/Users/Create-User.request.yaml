$kind: http-request
name: Create User
order: 1000
method: POST
url: '{{baseUrl}}/api/users'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Fatima Al-Najjar",
      "email": "fatima.najjar@takaful.ps",
      "password": "Secure@123456",
      "role": "FIELD_RESEARCHER",
      "branchPublicId": "{{branchPublicId}}",
      "phone": "0599000002"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => {
          pm.response.to.have.status(201);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("User publicId is present", () => {
          pm.expect(pm.response.json().data).to.have.property("publicId");
      });

      const data = pm.response.json().data;
      if (data && data.publicId) {
          pm.environment.set("userPublicId", data.publicId);
      }
