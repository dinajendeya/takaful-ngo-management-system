$kind: http-request
name: Update User
order: 4000
method: PATCH
url: '{{baseUrl}}/api/users/{{userPublicId}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: publicId
    value: '{{userPublicId}}'
    description: The public ID of the user to update
body:
  type: json
  content: |-
    {
      "fullName": "Fatima Al-Najjar Updated",
      "phone": "0599000099",
      "role": "BRANCH_MANAGER"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
