$kind: http-request
name: Get Category by ID
order: 3000
method: GET
url: '{{baseUrl}}/api/categories/{{categoryId}}'
description: |-
  ## Get Category by ID

  Retrieves the full details of a single catalog category using its numeric ID. Accessible to all authenticated staff users.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  ### Path Parameters
  | Parameter | Type    | Required | Description |
  |-----------|---------|----------|-------------|
  | id        | integer | ✅ Yes   | The category's numeric ID (e.g. `1`). Automatically stored in the `categoryId` environment variable after creating a category. |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "id": 1,
      "name": "FOOD",
      "description": "Food aid items including canned goods and dry rations.",
      "createdAt": "2024-01-01T00:00:00.000Z",
      "updatedAt": "2024-01-01T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — `id` is not a valid numeric value
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required role
  - `404 Not Found` — No category found with the given ID
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{categoryId}}'
    description: 'The numeric ID of the category (e.g. 1)'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Category id matches", () => {
          pm.expect(String(pm.response.json().data.id)).to.eql(pm.environment.get("categoryId"));
      });
      pm.test("Category has name", () => {
          pm.expect(pm.response.json().data).to.have.property("name");
      });
