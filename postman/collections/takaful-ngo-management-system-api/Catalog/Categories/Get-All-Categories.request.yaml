$kind: http-request
name: Get All Categories
order: 2000
method: GET
url: '{{baseUrl}}/api/categories'
description: |-
  ## Get All Categories

  Retrieves the full list of all catalog categories in the system. No pagination — all categories are returned in a single response. This endpoint is accessible to all authenticated staff users.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": [
      {
        "id": 1,
        "name": "FOOD",
        "description": "Food aid items including canned goods and dry rations.",
        "createdAt": "2024-01-01T00:00:00.000Z",
        "updatedAt": "2024-01-01T00:00:00.000Z"
      },
      {
        "id": 2,
        "name": "MEDICAL",
        "description": "Medical supplies and medications.",
        "createdAt": "2024-01-01T00:00:00.000Z",
        "updatedAt": "2024-01-01T00:00:00.000Z"
      }
    ]
  }
  ```

  ### Available Category Types
  `FOOD` · `CLEANING` · `BLANKETS` · `SCHOOL` · `ELECTRONICS` · `MEDICAL` · `MONETARY` · `COURSE`

  ### Error Responses
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required role
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Data is an array", () => {
          pm.expect(pm.response.json().data).to.be.an("array");
      });
