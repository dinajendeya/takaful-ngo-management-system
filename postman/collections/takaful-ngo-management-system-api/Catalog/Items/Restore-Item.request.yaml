$kind: http-request
name: Restore Item
order: 6000
method: PATCH
url: '{{baseUrl}}/api/items/{{catalogItemId}}/restore'
description: |-
  ## Restore Item

  Restores a previously soft-deleted catalog item by clearing its `deletedAt` timestamp. After restoration the item is fully active again and will appear in normal list queries.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  > 🔒 **Admin Only** — Only users with the `ADMIN` role are authorized to restore items.

  ### Path Parameters
  | Parameter | Type    | Required | Description |
  |-----------|---------|----------|-------------|
  | id        | integer | ✅ Yes   | The numeric ID of the soft-deleted item to restore. Set `catalogItemId` to the ID of the deleted item before calling this endpoint. |

  ### Success Response `200 OK`
  ```json
  {
    "success": true,
    "data": {
      "id": 1,
      "categoryId": 1,
      "name": "Rice Bag - 5kg",
      "unit": "BAG",
      "description": "5kg white rice bag.",
      "deletedAt": null,
      "createdAt": "2024-01-01T00:00:00.000Z",
      "updatedAt": "2024-01-03T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — `id` is not a valid numeric value
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user is not an admin
  - `404 Not Found` — No item found with the given ID

  ### Post-request Script
  On success, the `catalogItemId` environment variable is set to the restored item's ID.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{catalogItemId}}'
    description: 'The numeric ID of the soft-deleted item to restore (e.g. 1)'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Item is restored (deletedAt is null)", () => {
          pm.expect(pm.response.json().data.deletedAt).to.be.null;
      });
      pm.test("Item id is present", () => {
          pm.expect(pm.response.json().data).to.have.property("id");
      });

      const data = pm.response.json().data;
      if (data && data.id) {
          pm.environment.set("catalogItemId", String(data.id));
      }
