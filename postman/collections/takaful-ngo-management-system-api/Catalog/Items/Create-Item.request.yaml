$kind: http-request
name: Create Item
order: 1000
method: POST
url: '{{baseUrl}}/api/items'
description: |-
  ## Create Item

  Creates a new catalog item and assigns it to a category. Items represent physical or non-physical goods distributed to families (e.g. Rice Bag, Blanket, Medicine). Each item name must be unique within its category.

  ### Authorization
  Requires a valid **Bearer JWT access token** in the `Authorization` header.

  > 🔒 **Restricted** — Only users with the `ADMIN`, `BRANCH_MANAGER`, or `INVENTORY_MANAGER` role are authorized to create items.

  ### Request Body Fields
  | Field       | Type   | Required | Description |
  |-------------|--------|----------|-------------|
  | categoryId  | string | ✅ Yes   | The numeric ID of the parent category (must be an existing category). Stored in `categoryId` environment variable. |
  | name        | string | ✅ Yes   | Item name (1–150 characters) — must be unique within the category |
  | unit        | enum   | ✅ Yes   | Unit of measurement — one of: `PIECE`, `KILOGRAM`, `GRAM`, `LITER`, `MILLILITER`, `BOX`, `PACKAGE`, `SET`, `PAIR`, `METER`, `ROLL`, `CARTON`, `BAG` |
  | description | string | ❌ No    | Item description (max 5000 characters) |

  ### Success Response `201 Created`
  ```json
  {
    "success": true,
    "data": {
      "id": 1,
      "categoryId": 1,
      "name": "Rice Bag",
      "unit": "BAG",
      "description": "5kg white rice bag.",
      "deletedAt": null,
      "createdAt": "2024-01-01T00:00:00.000Z",
      "updatedAt": "2024-01-01T00:00:00.000Z"
    }
  }
  ```

  ### Error Responses
  - `400 Bad Request` — Validation failed (missing required fields, invalid unit, or non-numeric categoryId)
  - `401 Unauthorized` — Missing or invalid access token
  - `403 Forbidden` — Authenticated user lacks required role
  - `404 Not Found` — No category found with the given `categoryId`
  - `409 Conflict` — An item with the same name already exists in this category

  ### Post-request Script
  On success, the `catalogItemId` environment variable is automatically set to the newly created item's numeric `id`.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "categoryId": "{{categoryId}}",
      "name": "Rice Bag",
      "unit": "BAG",
      "description": "5kg white rice bag suitable for a family of four for one week."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => {
          pm.response.to.have.status(201);
      });
      pm.test("Success is true", () => {
          pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Item id is present", () => {
          pm.expect(pm.response.json().data).to.have.property("id");
      });
      pm.test("Item name matches", () => {
          pm.expect(pm.response.json().data.name).to.eql("Rice Bag");
      });
      pm.test("Item unit matches", () => {
          pm.expect(pm.response.json().data.unit).to.eql("BAG");
      });

      const data = pm.response.json().data;
      if (data && data.id) {
          pm.environment.set("catalogItemId", String(data.id));
      }
